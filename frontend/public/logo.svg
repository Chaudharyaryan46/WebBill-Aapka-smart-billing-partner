<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&amp;display=swap');
      .navy { fill: #0D3370; }
      .blue { fill: #0059D6; }
      .green { fill: #54C421; }
      .text-web { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 58px; letter-spacing: -1px; }
      .text-bill { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 58px; letter-spacing: -1px; }
      .text-tagline { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- ICON: Clipboard Base -->
  <g transform="translate(10, 10)">
    <!-- Clipboard Handle -->
    <path d="M 30 25 L 30 15 C 30 6 38 0 45 0 C 52 0 60 6 60 15 L 60 25" fill="none" stroke="#0059D6" stroke-width="6" stroke-linecap="round" />
    
    <!-- Clipboard Blue Board -->
    <rect x="15" y="25" width="60" height="70" rx="8" fill="#0059D6" />
    
    <!-- Paper -->
    <path d="M 22 25 L 73 25 L 73 85 C 68 80 63 85 58 80 C 53 85 48 80 43 85 C 38 80 33 85 28 80 C 25 83 22 83 22 83 Z" fill="#FFFFFF" />
    <path d="M 60 25 L 73 25 L 73 38 Z" fill="#E5F0FF" />
    
    <!-- Rupee Symbol -->
    <text x="26" y="52" font-family="Arial, sans-serif" font-weight="bold" font-size="24" class="blue">₹</text>
    
    <!-- Paper Lines -->
    <line x1="45" y1="42" x2="65" y2="42" stroke="#0D3370" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="50" x2="65" y2="50" stroke="#A0AAB5" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="62" x2="55" y2="62" stroke="#A0AAB5" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="70" x2="48" y2="70" stroke="#A0AAB5" stroke-width="3" stroke-linecap="round" />

    <!-- Lightning Bolt -->
    <path d="M 52 90 L 68 55 L 58 55 L 63 45 L 45 68 L 54 68 Z" fill="#0059D6" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Green Leaves -->
    <path d="M 68 35 C 75 25 85 28 85 28 C 85 28 85 40 75 45 C 68 35 68 35 68 35 Z" fill="#54C421" />
    <path d="M 68 45 C 75 45 80 50 80 50 C 80 50 75 58 65 55 C 68 45 68 45 68 45 Z" fill="#54C421" />
  </g>

  <!-- TEXT: WebBill -->
  <text x="105" y="75" class="text-web navy">Web</text>
  <text x="245" y="75" class="text-bill blue">Bill</text>

  <!-- TEXT: Tagline -->
  <line x1="105" y1="92" x2="135" y2="92" stroke="#0059D6" stroke-width="2" />
  <text x="145" y="96" class="text-tagline navy">Aapka Smart Billing Partner</text>
</svg>
